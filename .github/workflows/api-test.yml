name: GoRest API Testing CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman & Reporters
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Run Postman Tests via Newman
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run 2474802010336_GiangSeoSi_GoRest.postman_collection.json \
            -e 2474802010336_GiangSeoSi_GoRest_Env.postman_environment.json \
            -d users.csv \
            --env-var "token=$GOREST_TOKEN" \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: newman-report.html
