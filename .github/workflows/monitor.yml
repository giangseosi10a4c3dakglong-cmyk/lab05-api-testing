name: GoRest API Performance & Availability Monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Monitor Checks
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run 2474802010336_GiangSeoSi_GoRest.postman_collection.json \
            -e 2474802010336_GiangSeoSi_GoRest_Env.postman_environment.json \
            -d users.csv \
            --env-var "token=$GOREST_TOKEN"
